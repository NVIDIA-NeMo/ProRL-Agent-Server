# Controller V3 task template for the shared TMax fully-async bridge.
polar_rollout_url: "${POLAR_ROLLOUT_URL}"
polar_gateway_url: "${POLAR_GATEWAY_URL}"
polar_reward_key: "score"
polar_max_async_level: ${POLAR_MAX_ASYNC_LEVEL}
polar_fully_async: ${POLAR_FULLY_ASYNC}
polar_request_timeout: ${POLAR_REQUEST_TIMEOUT}
polar_task_timeout_floor: ${POLAR_TASK_TIMEOUT_FLOOR_SECONDS}
polar_train_agent_timeout: ${TMAX_TRAIN_AGENT_TIMEOUT_SECONDS}
polar_callback_host: "${POLAR_CALLBACK_HOST}"
polar_min_complete_accept_fraction: ${POLAR_MIN_COMPLETE_ACCEPT_FRACTION}
polar_early_stop_grace_sessions: ${POLAR_EARLY_STOP_GRACE_SESSIONS}
polar_max_trajectory_tokens: ${TMAX_TRAIN_PACK_LENGTH}
polar_allow_single_sample_over_token_cap: ${TMAX_ALLOW_SINGLE_SAMPLE_OVER_TOKEN_CAP}
polar_agent_cli_dir: ${AGENT_CLI_DIR}
polar_apptainer_image_dir: ${APPTAINER_IMAGE_DIR}

polar_task_template:
  timeout_seconds: "{sample.metadata.timeout_seconds}"
  runtime:
    backend: "apptainer"
    image: "{sample.metadata.sif_path}"
    network: "${POLAR_SANDBOX_NETWORK}"
    allow_internet: "{sample.metadata.allow_internet}"
    workdir: "{sample.metadata.workdir}"
    direct_exec_init_command: >-
      if [ -f /.singularity.d/env/99-rogue.sh ]; then
        . /.singularity.d/env/99-rogue.sh;
      fi
    env:
      HOME: "/polar/session/home"
      PATH: "${POLAR_AGENT_PATH}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS}"
      NUMEXPR_NUM_THREADS: "${NUMEXPR_NUM_THREADS}"
      TOKENIZERS_PARALLELISM: "${TOKENIZERS_PARALLELISM}"
      POLAR_GATEWAY_UDS: "${POLAR_SANDBOX_GATEWAY_UDS}"
      POLAR_HTTP_PROXY_UDS: "${POLAR_SANDBOX_HTTP_PROXY_UDS}"
      POLAR_HTTP_PROXY_PORT: "${POLAR_SANDBOX_HTTP_PROXY_PORT}"
      POLAR_APPTAINER_BROKER_PYTHON: "/opt/polar-mini-swe-agent/python/bin/python3.10"
      POLAR_APT_HTTP_SOURCE_POLICY: "${POLAR_APT_HTTP_SOURCE_POLICY}"
      http_proxy: "${http_proxy}"
      https_proxy: "${https_proxy}"
      HTTP_PROXY: "${HTTP_PROXY}"
      HTTPS_PROXY: "${HTTPS_PROXY}"
      no_proxy: "${no_proxy}"
      NO_PROXY: "${NO_PROXY}"
    kwargs:
      volumes:
        - "{args.polar_agent_cli_dir}:/opt/node:ro"
        - "${POLAR_GATEWAY_UDS_DIR}:/polar/gateway:ro"
${POLAR_AGENT_RUNTIME_VOLUME}
${POLAR_INTERNET_RUNTIME_VOLUME}
    prepare:
      - type: exec
        command: >-
          mkdir -p /polar/session/home /polar/session/logs/agent &&
          if command -v git >/dev/null 2>&1; then
            git config --global core.pager '';
          fi
        max_attempts: 3
        retry_backoff_seconds: 0.1
  agent:
    harness: "controller_v3"
    model_name: "${POLAR_AGENT_MODEL_NAME}"
    settings:
      runner_python: "/opt/polar-mini-swe-agent/python/bin/python3.10"
      step_limit: ${POLAR_AGENT_STEP_LIMIT}
      cost_limit: ${POLAR_AGENT_COST_LIMIT}
      wall_time_limit_seconds: ${TMAX_TRAIN_AGENT_TIMEOUT_SECONDS}
  builder:
    strategy: "router_policy"
  evaluator:
    strategy: "harbor"
    refresh_runtime: false
    config:
      tests_dir: "{sample.metadata.tests_dir}"
      verifier_timeout: "{sample.metadata.verifier_timeout}"

polar_task_id_template: "polar-controller-v3-{rollout_id}-{sample.group_index}"
