[tool:pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --disable-warnings
markers =
    asyncio: marks tests as async io tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    real_data: marks tests that require real data files
    unit: marks tests as unit tests (default)

# Warning filters - basic suppression (detailed filters in conftest.py)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::ResourceWarning

# Pytest filtering options
# Run only unit tests: pytest -m "not integration and not slow"
# Run only integration tests: pytest -m integration
# Run only tests with real data: pytest -m real_data
# Skip slow tests: pytest -m "not slow"

# Test collection patterns (already defined above)

# Console output
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (optional)
# --cov=openhands.nvidia --cov-report=term-missing --cov-report=html

asyncio_mode = auto
