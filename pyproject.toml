[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polar"
version = "0.1.0"
description = "Polar is a rollout server for agent RL."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
slime = [
    "slime",
    "transformers",
]

[project.scripts]
polar = "polar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
torch-backend = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["polar*"]

[tool.setuptools.package-data]
"polar.cluster" = ["templates/*.sbatch", "templates/*.sh"]
